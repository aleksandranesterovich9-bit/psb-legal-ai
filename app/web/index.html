<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSB Legal AI — юридическая справочная</title>
<style>
:root{
  --paper:#efe9dc;--sheet:#fbf8f1;--rail:#e6dfcf;--ink:#1b2130;--soft:#5d594f;--faint:#8c8576;--rule:#cfc5b0;--rule2:#e2dacb;
  --orange:#e2511b;--blue:#243f8f;--green:#2c6a3e;--amber:#9c5f06;--red:#9e2a20;--grey:#5f6570;--mark:#ffe58a;
  --serif:"PT Serif",Georgia,Cambria,"Times New Roman",serif;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"JetBrains Mono",Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14.5px/1.5 var(--sans);color:var(--ink);background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}button:disabled{cursor:not-allowed;opacity:.5}
.caps{font:600 10.5px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 390px;height:100vh}

/* ── реестр обращений ── */
.rail{background:var(--rail);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.mast{padding:20px 18px 16px;border-bottom:3px double var(--ink)}
.mast .caps{color:var(--soft)}
.mast b{display:block;font:700 27px/1 var(--serif);letter-spacing:-.01em;margin-top:6px}
.mast b i{font-style:normal;color:var(--orange)}
.new{margin:14px 18px 6px;padding:9px 12px;border:1px solid var(--ink);text-align:left;font-weight:600;display:flex;justify-content:space-between}
.new:hover{background:var(--ink);color:var(--sheet)}
.rail h4{margin:14px 18px 6px}
.reg{flex:1;overflow:auto;min-height:0}
.row{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;align-items:baseline;padding:8px 18px;border-top:1px solid var(--rule);cursor:pointer}
.row:last-child{border-bottom:1px solid var(--rule)}
.row:hover{background:#ddd5c2}.row.on{background:var(--sheet);box-shadow:inset 3px 0 0 var(--orange)}
.row .n{font:12px var(--mono);color:var(--faint)}
.row .t{font:14px/1.3 var(--serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t small{display:block;font:11px var(--sans);color:var(--faint);margin-top:2px}
.row button{color:var(--faint);visibility:hidden}.row:hover button{visibility:visible}.row button:hover{color:var(--red)}
.none{padding:8px 18px;color:var(--faint);font:italic 13.5px var(--serif)}
.kb{margin:10px 18px;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);text-align:left;display:flex;justify-content:space-between;font-size:13.5px}
.kb:hover{color:var(--orange)}
.state{padding:12px 18px 16px;font-size:12px;color:var(--soft);line-height:1.55}
.state b{display:flex;align-items:center;gap:7px;font:600 12.5px var(--sans);color:var(--ink)}
.sq{width:9px;height:9px;background:var(--faint);flex:none}.sq.ok{background:var(--green)}.sq.warn{background:#d39a1c}.sq.bad{background:var(--red)}

/* ── лист обращения ── */
.desk{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:12px;padding:10px 26px;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--soft)}
.bar .sp{flex:1}.bar span b{color:var(--ink);font-weight:600}
.tog{display:none;border:1px solid var(--ink);padding:3px 9px;font-size:12.5px;color:var(--ink)}
.warnline{display:none;padding:7px 26px;background:#f6e3b4;border-bottom:1px solid #d9bf7a;font-size:12.5px;color:#5c4300}
.scroll{flex:1;overflow:auto;min-height:0;padding:26px}
.col{max-width:760px;margin:0 auto}
.intro h2{font:700 30px/1.15 var(--serif);margin:6px 0 10px;letter-spacing:-.01em}
.intro p{font:16px/1.6 var(--serif);color:var(--soft);margin:0 0 22px;max-width:620px}
.ask{display:grid;grid-template-columns:34px 1fr 18px;gap:8px;align-items:baseline;width:100%;text-align:left;padding:11px 4px;border-top:1px solid var(--rule)}
.ask:last-child{border-bottom:1px solid var(--rule)}
.ask .n{font:12px var(--mono);color:var(--faint)}.ask .q{font:15.5px/1.4 var(--serif)}.ask .a{color:var(--faint)}
.ask:hover{background:var(--sheet)}.ask:hover .a{color:var(--orange)}
.entry{margin-bottom:30px}
.q-head,.a-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.q-text{font:italic 17px/1.5 var(--serif);border-left:3px solid var(--orange);padding:2px 0 2px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:0 1px 0 #fff inset,3px 3px 0 var(--rule2);padding:18px 22px 14px;margin-top:14px;position:relative}
.stamp{font:700 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;border:1.5px solid currentColor;padding:5px 8px 4px;transform:rotate(-1.6deg);color:var(--grey)}
.st-answer{color:var(--green)}.st-partial,.st-extractive,.st-false_premise{color:var(--amber)}.st-clarify{color:var(--blue)}
.st-conflict,.st-refusal,.st-error{color:var(--red)}
.body{font:16.5px/1.65 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere}
.ref{font:13.5px var(--mono);color:var(--blue);border-bottom:1px dotted var(--blue);padding:0 1px}
.ref:hover{background:var(--mark);border-bottom-style:solid}
.margin{margin-top:10px;padding:7px 10px;border-left:2px solid var(--amber);font-size:12.5px;color:#5c4300;background:#f8edd0}
.foot{margin-top:14px;border-top:1px solid var(--rule);padding-top:9px}
.fn{display:grid;grid-template-columns:24px 1fr;gap:4px;width:100%;text-align:left;padding:3px 0;font-size:13.5px;line-height:1.4}
.fn sup{font:11.5px var(--mono);color:var(--orange);vertical-align:baseline}
.fn:hover span{text-decoration:underline}
.fn em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--blue)}
.acts{display:flex;gap:16px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--faint)}
.acts button{color:var(--soft);border-bottom:1px solid var(--rule)}.acts button:hover{color:var(--orange);border-color:var(--orange)}
.wait{font:italic 15.5px var(--serif);color:var(--soft)}
.wait::after{content:"";display:block;height:2px;margin-top:12px;background:linear-gradient(90deg,var(--orange) 0 30%,transparent 30%) 0 0/200% 100%;animation:run 1.3s linear infinite}
@keyframes run{from{background-position:130% 0}to{background-position:-70% 0}}
.compose{border-top:3px double var(--ink);padding:14px 26px 12px;background:var(--paper)}
.compose form{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:flex-end}
textarea{flex:1;resize:none;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:9px 2px;font:16px/1.45 var(--serif);color:var(--ink);max-height:150px;min-height:42px;outline:none}
textarea::placeholder{color:var(--faint);font-style:italic}textarea:focus{border-bottom-color:var(--orange)}
.go{background:var(--orange);color:#fff;height:42px;padding:0 18px;font-weight:600;letter-spacing:.02em}
.go:hover:not(:disabled){background:var(--ink)}
.tip{max-width:760px;margin:7px auto 0;font-size:11.5px;color:var(--faint)}

/* ── основания ── */
.proof{background:var(--sheet);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.proof header{padding:20px 20px 12px;border-bottom:3px double var(--ink);display:flex;align-items:flex-end;gap:8px}
.proof header div{flex:1}.proof h3{font:700 21px/1.1 var(--serif);margin:5px 0 0}
.x{font-size:22px;line-height:1;color:var(--faint);display:none}.x:hover{color:var(--red)}
.plist{flex:1;overflow:auto;padding:4px 20px 20px}
.hintp{font:italic 14.5px/1.5 var(--serif);color:var(--faint);padding:16px 0}
.src{border-bottom:1px solid var(--rule);padding:14px 0}
.src summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:4px}
.src summary::-webkit-details-marker{display:none}
.src sup{font:13px var(--mono);color:var(--orange);vertical-align:baseline;padding-top:2px}
.src h5{margin:0;font:700 15px/1.3 var(--serif)}
.src .where{font:12.5px var(--mono);color:var(--blue);margin-top:2px}
.src .flags{font-size:11.5px;color:var(--faint);margin-top:3px}
.flag{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--green)}.flag.off{color:var(--red)}.flag.adj{color:var(--amber)}
.inner{margin:10px 0 0 30px}
blockquote{margin:0;padding:9px 12px;background:#fffdf6;border:1px solid var(--rule2);border-left:3px solid var(--mark);font:14.5px/1.55 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto}
dl{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;margin:9px 0;font-size:12px}
dt{color:var(--faint)}dd{margin:0;overflow-wrap:anywhere}
.open{font-size:12.5px;color:var(--blue);border-bottom:1px solid currentColor}.open:hover{color:var(--orange)}
.also{margin:16px 0 6px}
.doc{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--rule2);font:14px/1.35 var(--serif)}
.doc:hover{color:var(--orange)}

/* ── документ ── */
.veil{position:fixed;inset:0;background:#1b2130b3;display:none;place-items:center;z-index:20;padding:18px}
.veil.show{display:grid}
.page{background:var(--sheet);width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:8px 8px 0 #0004}
.page header{padding:18px 26px 12px;border-bottom:3px double var(--ink);display:flex;gap:12px;align-items:flex-start}
.page header div{flex:1}.page h3{font:700 19px/1.25 var(--serif);margin:4px 0 3px}.page small{color:var(--soft);font-size:12px}
.page .x{display:block}
.text{overflow:auto;padding:18px 26px 26px;font:15.5px/1.65 var(--serif)}
.frag{padding:5px 10px;margin:0 -10px;white-space:pre-wrap;overflow-wrap:anywhere}
.frag small{display:block;font:11px var(--mono);color:var(--faint)}
.frag.hl{background:var(--mark);box-shadow:-4px 0 0 var(--orange)}
.frag.rm{font:13px var(--sans);color:var(--red);background:#f6dfda}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:9px 15px;display:none;z-index:30;max-width:90vw;font-size:13.5px}
.toast.ok{background:var(--ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

@media(max-width:1180px){.app{grid-template-columns:230px minmax(0,1fr)}.proof{position:fixed;right:0;top:0;bottom:0;width:min(410px,100%);transform:translateX(102%);transition:transform .2s;z-index:10;box-shadow:-6px 0 0 #0002}.proof.show{transform:none}.tog.p,.proof .x{display:block}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-102%);transition:transform .2s;z-index:11}.rail.show{transform:none}.tog.m{display:block}.scroll{padding:18px 16px}.bar,.compose,.warnline{padding-left:16px;padding-right:16px}.bar .hide{display:none}.intro h2{font-size:25px}.sheet{padding:15px 15px 12px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="mast"><span class="caps">ПСБ · юридическая справочная</span><b>Legal&nbsp;AI<i>.</i></b></div>
    <button class="new" id="newChat"><span>Новое обращение</span><span>+</span></button>
    <h4 class="caps">Реестр обращений</h4>
    <div class="reg" id="reg"></div>
    <button class="kb" id="showDocs"><span>База знаний</span><span id="kbCount">→</span></button>
    <div class="state" id="state"><b><span class="sq"></span>Проверка сервера…</b></div>
  </aside>

  <main class="desk">
    <div class="bar">
      <button class="tog m" id="menuBtn">Реестр</button>
      <span id="today"></span><span class="hide" id="kbLine"></span>
      <span class="sp"></span>
      <span class="hide">Ответы — только по документам базы</span>
      <button class="tog p" id="proofBtn">Основания</button>
    </div>
    <div class="warnline" id="warnline"></div>
    <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
    <div class="compose">
      <form id="form">
        <textarea id="input" rows="1" placeholder="Сформулируйте вопрос: договор, контрагент, период…" maxlength="4000"></textarea>
        <button class="go" id="send" type="submit">Спросить →</button>
      </form>
      <div class="tip">Enter — отправить · Shift+Enter — новая строка · Внешние источники не используются; если сведений в базе нет, ассистент скажет об этом.</div>
    </div>
  </main>

  <aside class="proof" id="proof">
    <header><div><span class="caps">К заключению</span><h3>Основания</h3></div><button class="x" id="proofClose" aria-label="Закрыть">×</button></header>
    <div class="plist" id="plist"></div>
  </aside>
</div>

<div class="veil" id="veil"><div class="page">
  <header><div><span class="caps" id="dKind"></span><h3 id="dTitle"></h3><small id="dMeta"></small></div><button class="x" id="dClose" aria-label="Закрыть">×</button></header>
  <div class="text" id="dText"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const STORE = "psb-legal-ai-register-v3";
const EMPTY_PROOF = `<div class="hintp">Здесь появятся положения документов, на которых основано заключение: точная выдержка, реквизиты и статус документа.</div>`;
let chats = [], current = null, busy = false;

function load(){ try{ chats = JSON.parse(localStorage.getItem(STORE)) || []; }catch{ chats = []; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(chats.slice(0, 40))); }catch{} }
function toast(text, ok){ const t=$("toast"); t.textContent=text; t.className="toast"+(ok?" ok":""); t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none", 4500); }
function stamp(ts){ const d=new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth()+1)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
async function api(path, options){
  let response;
  try{ response = await fetch(path, options); }
  catch{ throw new Error("Сервер недоступен. Проверьте, что приложение запущено."); }
  if(!response.ok){ let detail=""; try{ detail=(await response.json()).detail; }catch{} throw new Error(typeof detail==="string"&&detail ? detail : "Ошибка сервера ("+response.status+")"); }
  return response.json();
}

function newChat(){ current = {id: Date.now().toString(36), ts: Date.now(), title: "", messages: []}; render(); showProof(null); $("input").focus(); }
function openChat(id){ current = chats.find(c => c.id === id) || current; render(); showProof([...current.messages].reverse().find(m => m.role==="assistant") || null); $("rail").classList.remove("show"); }
function removeChat(id){ chats = chats.filter(c => c.id !== id); save(); if(current.id === id) newChat(); else renderReg(); }

function renderReg(){
  $("reg").innerHTML = chats.length ? chats.map((c, i) => `<div class="row ${c.id===current.id?"on":""}" data-id="${c.id}"><span class="n">${pad(chats.length-i)}</span><span class="t">${esc(c.title)}<small>${stamp(c.ts)}</small></span><button data-del="${c.id}" title="Удалить из реестра">×</button></div>`).join("") : `<div class="none">Обращений пока нет</div>`;
}
/* Ссылки на пункты и статьи в тексте ответа ведут к соответствующему основанию. */
function linkRefs(text, cits, i){
  return esc(text).replace(/(пп?\.\s?\d+(?:\.\d+)+|ст\.\s?\d+(?:\.\d+)*)/g, m => {
    const num = m.replace(/^[^\d]+/, "");
    const hit = cits.find(c => m.startsWith("ст") ? c.document.short_title.includes("ст. "+num) : c.label.replace(/^[^\d]+/, "") === num);
    return hit ? `<button class="ref" data-cite="${i}:${esc(hit.id)}" title="Показать основание">${m}</button>` : m;
  });
}
function sheet(m, i){
  const r = m.data || {}, cits = r.citations || [];
  const foot = cits.map((c, k) => `<button class="fn" data-cite="${i}:${esc(c.id)}"><sup>${k+1}</sup><span>${esc(c.document.short_title)}${c.document.counterparties.length?" · "+esc(c.document.counterparties.join(", ")):""}${c.label&&c.label!=="фрагмент"?` — <em>${esc(c.label)}</em>`:""}</span></button>`).join("");
  const notes = [...(r.notes||[]), ...(r.issues||[]).map(x => "Не подтверждено проверкой: "+x)].map(n => `<div class="margin">${esc(n)}</div>`).join("");
  const info = r.timings ? `${r.timings.total.toFixed(1)} с · поиск: ${esc(r.search_mode||"")}${r.mode==="llm"?" · DeepSeek":""}` : "";
  return `<div class="sheet"><div class="a-head"><span class="caps">Заключение</span><span class="stamp st-${esc(m.status||"error")}">${esc(m.label||"Ошибка")}</span></div>
    <div class="body">${linkRefs(m.content, cits, i)}</div>${notes}
    ${foot?`<div class="foot"><div class="caps" style="margin-bottom:5px">Основания</div>${foot}</div>`:""}
    <div class="acts"><button data-copy="${i}">Скопировать</button>${cits.length||(r.consulted||[]).length?`<button data-ev="${i}">Открыть основания</button>`:""}<span>${info}</span></div></div>`;
}
function render(){
  renderReg();
  const col = $("col");
  if(!current.messages.length){
    col.innerHTML = `<div class="intro"><span class="caps">Справка по базе знаний</span><h2>Что сказано в документах — и где именно</h2><p>Задайте вопрос по договору, регламенту или статье закона. Заключение опирается только на базу знаний: к каждому выводу приложен пункт документа, а если сведений нет — будет прямой отказ с объяснением, чего не хватает.</p><span class="caps">Примеры обращений</span><div id="examples" style="margin-top:8px"></div></div>`;
    api("/api/examples").then(list => { const box=$("examples"); if(box) box.innerHTML = list.map((q, i) => `<button class="ask" data-q="${esc(q)}"><span class="n">${pad(i+1)}</span><span class="q">${esc(q)}</span><span class="a">→</span></button>`).join(""); }).catch(()=>{});
    return;
  }
  let n = 0, html = "";
  current.messages.forEach((m, i) => {
    if(m.role === "user"){ n++; html += `${n>1?"</div>":""}<div class="entry"><div class="q-head"><span class="caps">Вопрос ${pad(n)}</span></div><div class="q-text">${esc(m.content)}</div>`; }
    else html += sheet(m, i);
  });
  if(busy) html += `<div class="sheet"><div class="wait">Ищу положения в базе и сверяю ответ с источниками</div></div>`;
  col.innerHTML = html + "</div>";
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
function showProof(m, focusId){
  const box = $("plist"), r = m && m.data;
  if(!r || (!(r.citations||[]).length && !(r.consulted||[]).length)){ box.innerHTML = m ? `<div class="hintp">К этому заключению оснований нет: в базе не нашлось положений, на которые можно опереться.</div>` : EMPTY_PROOF; return; }
  const cits = (r.citations||[]).map((c, k) => { const d=c.document; return `<details class="src" ${(!focusId||focusId===c.id)?"open":""} id="src-${esc(c.id)}">
    <summary><sup>${k+1}</sup><div><h5>${esc(d.short_title)}</h5>${c.label&&c.label!=="фрагмент"?`<div class="where">${esc(c.label)}</div>`:""}
      <div class="flags">${esc(d.category)} · <span class="flag ${d.repealed?"off":""}">${esc(d.status)}</span>${c.verified?" · цитата сверена с текстом":` · <span class="flag adj">цитата уточнена по тексту</span>`}</div></div></summary>
    <div class="inner"><blockquote>${esc(c.quote)}</blockquote>
      <dl><dt>Документ</dt><dd>${esc(d.title)}</dd><dt>Файл</dt><dd>${esc(d.filename)}</dd>${d.validity?`<dt>Действие</dt><dd>${esc(d.validity)}</dd>`:""}${d.counterparties.length?`<dt>Контрагент</dt><dd>${esc(d.counterparties.join(", "))}</dd>`:""}<dt>Метка</dt><dd>${esc(c.id)}</dd></dl>
      ${d.security_note?`<div class="margin" style="margin-bottom:8px">${esc(d.security_note)}</div>`:""}
      <button class="open" data-doc="${esc(d.id)}" data-chunk="${esc(c.chunk_id)}">Открыть документ на этом месте</button></div></details>`; }).join("");
  const other = (r.consulted||[]).map(d => `<button class="doc" data-doc="${esc(d.id)}"><span>${esc(d.short_title)}</span><span class="flag ${d.repealed?"off":""}">${esc(d.status)}</span></button>`).join("");
  box.innerHTML = cits + (other ? `<div class="caps also">Также просмотрены при поиске</div>${other}` : "");
  if(focusId){ const el=$("src-"+focusId); if(el) el.scrollIntoView({block:"nearest"}); }
}
async function openDoc(id, chunkId){
  try{
    const d = await api("/api/documents/"+encodeURIComponent(id));
    $("dKind").textContent = d.category + " · " + d.status; $("dTitle").textContent = d.title;
    $("dMeta").textContent = [d.validity, d.filename].filter(Boolean).join(" · ");
    $("dText").innerHTML = (d.security_note?`<div class="margin" style="margin-bottom:12px">${esc(d.security_note)}</div>`:"") + d.chunks.map(c => `<div class="frag ${c.chunk_id===chunkId?"hl":""} ${c.removed?"rm":""}" id="f-${esc(c.chunk_id)}">${c.edition?`<small>${esc(c.edition)}</small>`:""}${esc(c.text)}</div>`).join("");
    $("veil").classList.add("show");
    const el = chunkId && $("f-"+chunkId); if(el) el.scrollIntoView({block:"center"}); else $("dText").scrollTop = 0;
  }catch(e){ toast(e.message); }
}
async function showDocs(){
  try{
    const list = await api("/api/documents");
    $("dKind").textContent = "Состав"; $("dTitle").textContent = "База знаний"; $("dMeta").textContent = `${list.length} документов — источник всех заключений`;
    $("dText").innerHTML = list.map(d => `<button class="doc" data-doc="${esc(d.id)}"><span>${esc(d.short_title)}<br><small style="font:12px var(--sans);color:var(--faint)">${esc(d.category)}${d.validity?" · "+esc(d.validity):""}</small></span><span class="flag ${d.repealed?"off":""}">${esc(d.status)}</span></button>`).join("");
    $("veil").classList.add("show"); $("rail").classList.remove("show");
  }catch(e){ toast(e.message); }
}
async function send(text){
  text = text.trim(); if(!text || busy) return;
  if(!current.messages.length){ current.title = text.slice(0, 90); chats.unshift(current); }
  current.messages.push({role:"user", content:text});
  busy = true; $("send").disabled = true; $("input").value = ""; autosize(); render();
  let message;
  try{
    const payload = current.messages.filter(m => m.role==="user" || m.status!=="error").map(m => ({role:m.role, content:m.content}));
    const r = await api("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:payload})});
    message = {role:"assistant", content:r.answer, status:r.status, label:r.status_label, data:r};
  }catch(e){ message = {role:"assistant", content:e.message, status:"error", label:"Ошибка", data:null}; toast(e.message); }
  current.messages.push(message);
  busy = false; $("send").disabled = false; save(); render(); showProof(message); $("input").focus();
}
function autosize(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,150)+"px"; }
async function health(){
  const el = $("state"), warn = $("warnline");
  try{
    const h = await api("/api/health");
    if(h.status==="error"){ el.innerHTML = `<b><span class="sq bad"></span>База знаний не загружена</b>${esc(h.error)}`; return; }
    if(h.status==="starting"){ el.innerHTML = `<b><span class="sq warn"></span>Индексация базы знаний…</b>`; return; }
    const errors = Object.keys(h.api_errors||{});
    el.innerHTML = `<b><span class="sq ${h.llm&&!errors.length?"ok":"warn"}"></span>${h.llm?"DeepSeek на связи":"DeepSeek не подключён"}</b>${h.llm?esc(h.llm_model)+"<br>":""}Поиск: ${esc(h.search_mode)}${h.indexing?" · считаются эмбеддинги":""}<br>${h.documents} документов · ${h.chunks} фрагментов`;
    $("kbCount").textContent = h.documents+" →"; $("kbLine").innerHTML = ` · в базе <b>${h.documents}</b> документов`;
    warn.style.display = h.llm && !errors.includes("/chat/completions") ? "none" : "block";
    warn.textContent = h.llm ? "Модель DeepSeek сейчас не отвечает — вместо заключения показываются дословные положения документов." : "Модель DeepSeek не подключена (нет ключа в .env) — вместо заключения показываются дословные положения документов.";
  }catch{ el.innerHTML = `<b><span class="sq bad"></span>Сервер недоступен</b>`; }
}

$("today").innerHTML = "<b>" + new Date().toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"}) + "</b>";
$("form").addEventListener("submit", e => { e.preventDefault(); send($("input").value); });
$("input").addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send($("input").value); } });
$("input").addEventListener("input", autosize);
$("newChat").addEventListener("click", () => { newChat(); $("rail").classList.remove("show"); });
$("showDocs").addEventListener("click", showDocs);
$("menuBtn").addEventListener("click", () => $("rail").classList.toggle("show"));
$("proofBtn").addEventListener("click", () => $("proof").classList.toggle("show"));
$("proofClose").addEventListener("click", () => $("proof").classList.remove("show"));
$("dClose").addEventListener("click", () => $("veil").classList.remove("show"));
$("veil").addEventListener("click", e => { if(e.target.id==="veil") $("veil").classList.remove("show"); });
document.addEventListener("keydown", e => { if(e.key==="Escape") ["veil","proof","rail"].forEach(id => $(id).classList.remove("show")); });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-q],[data-id],[data-del],[data-cite],[data-copy],[data-ev],[data-doc]"); if(!t) return;
  if(t.dataset.del){ e.stopPropagation(); removeChat(t.dataset.del); }
  else if(t.dataset.q) send(t.dataset.q);
  else if(t.dataset.id) openChat(t.dataset.id);
  else if(t.dataset.cite){ const k = t.dataset.cite.indexOf(":"); showProof(current.messages[+t.dataset.cite.slice(0,k)], t.dataset.cite.slice(k+1)); $("proof").classList.add("show"); }
  else if(t.dataset.ev){ showProof(current.messages[+t.dataset.ev]); $("proof").classList.add("show"); }
  else if(t.dataset.copy){ navigator.clipboard.writeText(current.messages[+t.dataset.copy].content).then(()=>toast("Заключение скопировано", true)).catch(()=>toast("Не удалось скопировать")); }
  else if(t.dataset.doc) openDoc(t.dataset.doc, t.dataset.chunk);
});
load(); newChat(); health(); setInterval(health, 15000);
</script>
